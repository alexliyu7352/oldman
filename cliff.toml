# GitHub Release notes, generated by git-cliff from the commit subjects. release.yml runs it on every
# release tag; preview the next release locally with `uvx git-cliff@2.14.2 --unreleased`.
# The subject line is the release note: `type(scope): summary` in English, written for users
# (docs/public/zh/developers/maintenance.md). The summary goes in as written, never re-capitalised:
# one that opens with a command or a name (`startproject`, `account_urls`) must keep its spelling.

[changelog]
body = """
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | split(pat="\n") | first | trim }} ([{{ commit.id | truncate(length=7, end="") }}](https://github.com/alexliyu7352/oldman/commit/{{ commit.id }}))
{%- endfor %}
{% endfor %}
{% if previous.version %}
**Full Changelog**: https://github.com/alexliyu7352/oldman/compare/{{ previous.version }}...{{ version }}
{% endif %}
"""
trim = true

[git]
conventional_commits = true
# A subject without a type still appears, under "Other": a fix must never drop out of the notes silently.
filter_unconventional = false
protect_breaking_commits = true
# Final releases only, so a final release lists everything since the previous final release, release
# candidates included. release.yml widens the pattern for a prerelease.
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+$"
sort_commits = "oldest"
# The HTML comments order the groups and are stripped from the headings.
# Corrections for subjects that cannot change after the push. Each names its commit and why.
commit_preprocessors = [
    # 723109a3 changed what a route handler sees, but its subject has no "!".
    { pattern = "^fix\\(proxy\\): the relay passes on the upstream status and never ends a failed relay like a complete one", replace = "fix(proxy)!: the relay passes on the upstream status and never ends a failed relay like a complete one; once part of the body is sent, a failure closes the player's connection and raises RequestCancelled, so the route handler's first await after the relay is cancelled" },
]
commit_parsers = [
    # afad4457's rule was replaced before release by c9869a81; listing both would contradict.
    { sha = "afad4457f6c020f2b47c50d0933b028588793871", skip = true },
    { field = "breaking", pattern = "true", group = "<!-- 0 -->Breaking changes" },
    { message = "^feat", group = "<!-- 1 -->Added" },
    { message = "^fix", group = "<!-- 2 -->Fixed" },
    { message = "^perf", group = "<!-- 3 -->Performance" },
    { message = "^refactor", group = "<!-- 4 -->Changed" },
    { message = "^docs", group = "<!-- 5 -->Documentation" },
    { message = "^revert", group = "<!-- 6 -->Reverted" },
    { message = "^(test|build|ci|chore|release)", skip = true },
    { message = ".*", group = "<!-- 7 -->Other" },
]
