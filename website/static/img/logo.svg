<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
  <!-- The Oldman brand mark, as oldman-web draws it (.oldman-brand-mark): the signature gradient, one white dot. -->
  <defs>
    <linearGradient id="signature" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#16a34a"/>
    </linearGradient>
  </defs>
  <rect width="24" height="24" rx="6" fill="url(#signature)"/>
  <circle cx="12" cy="12" r="5" fill="#fff"/>
</svg>
