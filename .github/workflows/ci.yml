name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: verify (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.13 and 3.14 are pinned to patch releases: uvloop 0.22.1 crashes in its
        # async-generator finalizer under asyncio debug mode on CPython 3.13.15 and 3.14.7
        # (MagicStack/uvloop#699). Lift the pins when uvloop ships a fix.
        python: ["3.12", "3.13.11", "3.14.2"]
    steps:
      - uses: actions/checkout@v4

      # pnpm/action-setup reads "packageManager" from package.json (pnpm 9.12.3).
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          uv sync --group dev

      # The Redis, NATS and Taskiq checks fail (not skip) without redis-server (6.2 or newer)
      # and nats-server; each check starts its own servers, so no system service is needed.
      - name: Install redis-server for the integration gate
        run: |
          sudo apt-get update
          sudo apt-get install -y redis-server
          redis-server --version

      - name: Install nats-server for the integration gate
        env:
          NATS_VERSION: v2.15.0
          NATS_SHA256: 5d2c51caca950333aba84911df7d377f826f3a59ec36061c6539105084f65c92
        run: |
          archive="nats-server-${NATS_VERSION}-linux-amd64"
          curl -fsSL -o "$RUNNER_TEMP/$archive.tar.gz" "https://github.com/nats-io/nats-server/releases/download/${NATS_VERSION}/$archive.tar.gz"
          echo "$NATS_SHA256  $RUNNER_TEMP/$archive.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive.tar.gz" -C "$RUNNER_TEMP"
          echo "NATS_SERVER=$RUNNER_TEMP/$archive/nats-server" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/$archive/nats-server" --version

      # test_oldman_web_pack_boundary reads the built oldman-web package (dist/).
      - name: Build oldman-web
        run: pnpm --filter oldman-web build

      - name: Lint
        run: uv run ruff check oldman tests scripts && uv run ruff format --check oldman tests scripts

      - name: Type check
        if: startsWith(matrix.python, '3.12')
        run: uv run pyright

      - name: Python tests
        run: uv run --index-strategy unsafe-best-match python3 -m unittest discover -s tests -t .

      - name: Frontend tests and type checks
        if: startsWith(matrix.python, '3.12')
        run: pnpm verify:frontend

      - name: Web boundary inventory
        if: startsWith(matrix.python, '3.12')
        run: pnpm verify:web-boundaries
