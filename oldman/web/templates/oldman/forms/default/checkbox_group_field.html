<fieldset{{ attrs|html_attrs }}>
  <legend{{ label_attrs|html_attrs }}>{{ label_text }}{% if field.flags.required %}<span class="om-form-required" aria-hidden="true">*</span>{% endif %}</legend>
  {% for group in groups %}
    {% if group.label %}<p{{ group_title_attrs|html_attrs }}>{{ group.label }}</p>{% endif %}
    <div{{ group_attrs|html_attrs }}>
      {% for option in group.options %}<label{{ option.label_attrs|html_attrs }}>{{ option.control_html }}<span>{{ option.label_text }}</span></label>{% endfor %}
    </div>
  {% endfor %}
  {{ help_html }}
  {{ errors_html }}
</fieldset>
