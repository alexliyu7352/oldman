<div class="om-input-spinner" data-om-component="input-spinner">
  <button type="button" class="om-input-spinner-button" data-om-input-spinner-decrease aria-controls="{{ input_attrs.id }}" aria-label="{{ decrease_label }}">−</button>
  <input{{ input_attrs|html_attrs }}>
  <button type="button" class="om-input-spinner-button" data-om-input-spinner-increase aria-controls="{{ input_attrs.id }}" aria-label="{{ increase_label }}">+</button>
</div>
