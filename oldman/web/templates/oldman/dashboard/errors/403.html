{% extends "oldman/dashboard/errors/_base.html" %}

{% block title %}{{ _("Access denied") }} · {{ site_name() }}{% endblock %}

{% block content %}
  <div class="error-status error-status--warning" aria-hidden="true">403</div>
  <h1 class="error-title">{{ _("Access denied") }}</h1>
  <p class="error-description">{{ description or _("You do not have permission to access this page.") }}</p>
  <a class="error-action" href="{{ home_url }}">{{ _("Return to dashboard") }}</a>
{% endblock %}
