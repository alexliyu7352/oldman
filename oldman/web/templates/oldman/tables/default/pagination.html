<div data-om-table-pagination class="om-pagination">
  <button type="button" class="om-page-button om-page-button-nav" aria-label="{{ _('Previous') }}"{% if previous_page %} data-om-table-page="{{ previous_page }}"{% else %} disabled{% endif %}><i class="ri-arrow-left-s-line" aria-hidden="true"></i></button>
  {% for item in pages %}
    {% if item.ellipsis %}
    <span class="om-pagination-ellipsis" aria-hidden="true">…</span>
    {% else %}
    <button type="button" class="om-page-button{% if item.active %} is-active{% endif %}" data-om-table-page="{{ item.page }}"{% if item.active %} aria-current="page"{% endif %}>{{ item.page }}</button>
    {% endif %}
  {% endfor %}
  <button type="button" class="om-page-button om-page-button-nav" aria-label="{{ _('Next') }}"{% if next_page %} data-om-table-page="{{ next_page }}"{% else %} disabled{% endif %}><i class="ri-arrow-right-s-line" aria-hidden="true"></i></button>
</div>
