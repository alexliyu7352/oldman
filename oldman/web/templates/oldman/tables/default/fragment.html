<div{{ partial_attrs|html_attrs }}>
  <div class="om-table-shell">
    <div class="om-table-scroll">
      <table class="om-table min-w-[680px]">
        {{ head_html }}
        <tbody data-om-table-body>
          {% if loading|default(false) %}
            <tr data-om-table-initial-loading><td colspan="{{ columns|length + (1 if selectable else 0) }}" class="om-table-loading-cell">
              <span class="inline-flex items-center justify-center gap-2">
                <span data-om-scoped-preloader-spinner aria-hidden="true"></span>
                <span>{{ loading_message }}</span>
              </span>
            </td></tr>
          {% elif rows %}
            {% for row in rows %}{{ row }}{% endfor %}
          {% else %}
            <tr><td colspan="{{ columns|length + (1 if selectable else 0) }}" class="om-table-empty-cell">{{ empty_html }}</td></tr>
          {% endif %}
        </tbody>
      </table>
    </div>
  </div>
  {% if show_footer|default(true) %}
  <div class="om-table-footer">
    <div class="om-table-footer-meta">
      <label class="om-table-page-size">
        <span>{{ _("Rows per page") }}</span>
        <select class="om-select om-select-sm w-20 min-w-20" data-om-table-page-size-control aria-label="{{ _('Rows per page') }}">
          {% for option in page_size_options %}
          <option value="{{ option }}"{% if option == current_page_size %} selected{% endif %}>{{ option }}</option>
          {% endfor %}
        </select>
      </label>
      {{ summary_html }}
    </div>
    {{ pagination_html }}
  </div>
  {% endif %}
</div>
