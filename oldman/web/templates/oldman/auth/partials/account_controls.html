{% macro user_account_controls(display_name, session_path, logout_path, subtitle, avatar_url=none) %}
  <div class="om-dropdown" data-om-component="dropdown">
    <button type="button" class="oldman-account-button" id="page-header-user-dropdown" data-om-dropdown-toggle aria-haspopup="true" aria-expanded="false">
      <span class="oldman-avatar" aria-hidden="true">
        {% if avatar_url %}
          <img src="{{ avatar_url }}" alt="">
        {% else %}
          <i class="ri-user-3-line"></i>
        {% endif %}
      </span>
      <span class="hidden min-w-0 xl:block">
        <span class="oldman-account-name">{{ display_name }}</span>
        <span class="oldman-account-subtitle">{{ subtitle }}</span>
      </span>
      <i class="ri-arrow-down-s-line hidden text-base leading-none text-content-muted xl:block" aria-hidden="true"></i>
    </button>
    <div class="om-dropdown-menu om-dropdown-menu-end hidden" data-om-dropdown-menu hidden aria-labelledby="page-header-user-dropdown">
      <p class="om-dropdown-label">{{ _('Welcome') }}</p>
      <div class="om-dropdown-divider" role="separator"></div>
      <a class="om-dropdown-item" href="{{ session_path }}">
        <i class="ri-account-circle-line" aria-hidden="true"></i>
        <span>{{ _('Session') }}</span>
      </a>
      <a class="om-dropdown-item" href="{{ logout_path }}">
        <i class="ri-logout-box-r-line" aria-hidden="true"></i>
        <span>{{ _('Logout') }}</span>
      </a>
    </div>
  </div>
{% endmacro %}
