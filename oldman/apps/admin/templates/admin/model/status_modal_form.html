<form method="post" action="{{ action }}" data-om-component="form" data-om-form data-om-form-mode="json">
  <input type="hidden" name="csrfmiddlewaretoken" value="{{ csrf_token }}">
  <input type="hidden" name="is_active" value="{{ 'true' if target_active else 'false' }}">
  <div class="text-center">
    <div class="om-avatar-md mx-auto mb-3">
      <div class="om-avatar-title bg-amber-50 text-amber-700 rounded-full text-2xl">
        <i class="ri-toggle-line" aria-hidden="true"></i>
      </div>
    </div>
    <h5>{{ _("Enable user?") if target_active else _("Disable user?") }}</h5>
    <p class="text-default-500 mb-0">{{ user.username }}</p>
  </div>
  <div class="om-alert-danger mb-3" data-om-form-message hidden></div>
  <p class="text-default-500 text-xs mb-3" data-om-form-status role="status" aria-live="polite"></p>
  <div class="om-modal-footer px-0 pb-0">
    <button class="om-button om-button-light" type="button" data-om-modal-close>{{ _("Cancel") }}</button>
    <button class="om-button om-button-warning" type="submit" data-om-form-submit>{{ _("Confirm") }}</button>
  </div>
</form>
