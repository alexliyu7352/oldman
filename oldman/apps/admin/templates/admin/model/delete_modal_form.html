<form method="post" action="{{ action }}" data-om-component="form" data-om-form data-om-form-mode="json">
  <input type="hidden" name="csrfmiddlewaretoken" value="{{ request.ctx.csrf_token }}">
  <div class="text-center">
    <div class="om-avatar-md mx-auto mb-3">
      <div class="om-avatar-title bg-red-50 text-red-700 rounded-full text-2xl">
        <i class="ri-delete-bin-line" aria-hidden="true"></i>
      </div>
    </div>
    <h5>{{ _("Delete user?") }}</h5>
    <p class="text-default-500 mb-0">{{ object.username }}</p>
  </div>
  <div class="om-alert-danger mb-3" data-om-form-message hidden></div>
  <p class="text-default-500 text-xs mb-3" data-om-form-status role="status" aria-live="polite"></p>
  <div class="om-modal-footer px-0 pb-0">
    <button class="om-button om-button-light" type="button" data-om-modal-close>{{ _("Cancel") }}</button>
    <button class="om-button om-button-danger" type="submit" data-om-form-submit>{{ _("Delete") }}</button>
  </div>
</form>
