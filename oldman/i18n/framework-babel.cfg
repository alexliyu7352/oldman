[python: cli/**/*.py]
encoding = utf-8

[python: runtime/base.py]
encoding = utf-8

[python: apps/admin/**/*.py]
encoding = utf-8

[python: auth/**/*.py]
encoding = utf-8

[python: web/**/*.py]
encoding = utf-8

[jinja2: apps/admin/templates/**/*.html]
encoding = utf-8
extensions=jinja2.ext.i18n,oldman.web.template.I18nExtension,oldman.web.security.csrf.CsrfExtension
silent=False

[jinja2: web/templates/**/*.html]
encoding = utf-8
extensions=jinja2.ext.i18n,oldman.web.template.I18nExtension,oldman.web.security.csrf.CsrfExtension
silent=False
